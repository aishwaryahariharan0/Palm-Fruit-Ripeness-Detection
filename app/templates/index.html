<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palm Fruit Ripeness Detection</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:       #d4a017;
      --gold-light: #f0c040;
      --text-main:  #f0ede6;
      --text-muted: #d0e8c8;
      --card-bg:    rgba(10, 40, 20, 0.80);
      --radius:     16px;
    }

    body {
      min-height: 100vh;
      background-color: #0a1f11;
      background-attachment: fixed;
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      font-family: 'DM Sans', sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 0;
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    .icon {
      font-size: 56px;
      margin-bottom: 10px;
      animation: sway 4s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes sway {
      0%,100% { transform: rotate(-4deg); }
      50%      { transform: rotate(4deg); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(26px, 5vw, 38px);
      color: var(--gold-light);
      letter-spacing: 0.5px;
      line-height: 1.2;
      margin-bottom: 6px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.7);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 36px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(212,160,23,0.30);
      border-radius: var(--radius);
      padding: 40px 36px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .drop-zone {
      border: 2px dashed rgba(212,160,23,0.45);
      border-radius: 12px;
      padding: 36px 20px;
      cursor: pointer;
      transition: border-color 0.25s, background 0.25s;
      margin-bottom: 28px;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.active {
      border-color: var(--gold);
      background: rgba(212,160,23,0.08);
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .drop-icon { font-size: 38px; margin-bottom: 10px; }
    .drop-label { font-size: 15px; color: var(--text-muted); }
    .drop-label span { color: var(--gold-light); font-weight: 500; }
    .file-name {
      margin-top: 10px;
      font-size: 13px;
      color: var(--gold-light);
      min-height: 18px;
    }

    .formats {
      font-size: 12px;
      color: rgba(200, 230, 200, 0.65);
      margin-bottom: 24px;
    }

    .btn-detect {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold) 0%, #b8860b 100%);
      color: #0d2b1a;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn-detect:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-detect:active { transform: translateY(0); }

    .error-box {
      background: rgba(185,28,28,0.2);
      border: 1px solid rgba(220,38,38,0.4);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fca5a5;
      font-size: 14px;
      margin-bottom: 20px;
      text-align: left;
    }

    #loading {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    #loading.show { display: flex; }
    .spinner {
      width: 52px; height: 52px;
      border: 4px solid rgba(212,160,23,0.25);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: var(--gold-light); font-size: 15px; }

    footer {
      margin-top: 30px;
      color: rgba(220, 220, 200, 0.5);
      font-size: 12px;
      z-index: 1;
      position: relative;
    }
  </style>
</head>

<body style="background-image: url('{{ url_for('static', filename='web.png') }}');">

<div id="loading">
  <div class="spinner"></div>
  <p>Analyzing… please wait</p>
</div>

<div class="wrapper">
  <div class="icon">🌴</div>
  <h1>Palm Fruit Ripeness<br>Detection</h1>
  <p class="subtitle">Upload an image or video to detect ripeness using AI</p>

  <div class="card">

    {% if error %}
    <div class="error-box">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data" id="uploadForm">
      <div class="drop-zone" id="dropZone">
        <input type="file" name="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp,.mp4,.avi,.mov,.mkv" required />
        <div class="drop-icon">📂</div>
        <div class="drop-label">Drag & drop or <span>browse</span></div>
        <div class="file-name" id="fileName">No file selected</div>
      </div>

      <p class="formats">Images: JPG, JPEG, PNG, WEBP &nbsp;|&nbsp; Videos: MP4, AVI, MOV, MKV</p>

      <button type="submit" class="btn-detect">🔍 Detect Ripeness</button>
    </form>

  </div>
  <footer>Palm Fruit Detection System &copy; 2025</footer>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const fileName  = document.getElementById('fileName');
  const dropZone  = document.getElementById('dropZone');
  const form      = document.getElementById('uploadForm');
  const loading   = document.getElementById('loading');

  fileInput.addEventListener('change', () => {
    fileName.textContent = fileInput.files[0] ? fileInput.files[0].name : 'No file selected';
  });

  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('active'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('active'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('active');
    if (e.dataTransfer.files.length) {
      fileInput.files = e.dataTransfer.files;
      fileName.textContent = e.dataTransfer.files[0].name;
    }
  });

  form.addEventListener('submit', () => loading.classList.add('show'));
</script>
</body>
</html>
